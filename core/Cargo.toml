[package]
name = "muninn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Muninn application runtime: acquisition, cache lifecycle, feeds and scheduling"

[lib]
name = "muninn_core"
path = "src/lib.rs"

[dependencies]
muninn-domain = { path = "../crates/domain" }
muninn-policy = { path = "../crates/policy" }
muninn-capture = { path = "../crates/capture" }
muninn-storage = { path = "../crates/storage" }
muninn-media = { path = "../crates/media" }
muninn-navigation = { path = "../crates/navigation" }
bytes = "1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3"
tower-service = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"
flate2 = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "time", "macros", "io-util", "sync", "process"] }
ureq = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
