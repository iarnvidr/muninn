name: Feature request
description: Suggest an improvement to Muninn.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to complete and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe the behavior you would find useful and any alternatives you have tried.
    validations:
      required: true
