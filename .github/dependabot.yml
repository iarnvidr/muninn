version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Avoid rebuilding several dependency branches after every app merge.
    # Security update PRs are managed separately by GitHub.
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ["*"]
