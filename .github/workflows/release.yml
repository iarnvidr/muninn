name: Protected updater release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching the existing owner-created v-tag
        required: true
        type: string
      tag:
        description: Existing tag (for example v1.2.3); never created by this workflow
        required: true
        type: string
      publish:
        description: Publish reviewed assets to the existing GitHub Release (approval required)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment:
      name: muninn-release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Verify main, source version, existing tag and protected-main target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git check-ref-format "refs/tags/$INPUT_TAG"
          git fetch --force origin main "refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD^{commit})"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$GITHUB_SHA" = "$main_commit"
          tag_commit="$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          test "$version" = "$INPUT_VERSION"
          test "$INPUT_TAG" = "v$INPUT_VERSION"
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"build"); from updater_release import stable; assert stable(sys.argv[1])' "$version"
      - name: Install native build dependencies
        run: brew install meson ninja pkgconf minisign
      - name: Build, test and sign exact app bundle
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/muninn"
      - name: App launch and localhost health smoke
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/muninn/Muninn.app"
      - name: Create Tauri-compatible archive, sign and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          command -v npm >/dev/null
          npx --yes @tauri-apps/cli@2.10.1 signer --help
          cd "$RUNNER_TEMP/muninn"
          test -d Muninn.app/Contents/Resources/licenses
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Muninn.app/Contents/Info.plist)
          python3 build/updater_release.py check-version "$bundle_version" "$INPUT_VERSION"
          tar -czf Muninn.app.tar.gz Muninn.app
          npx --yes @tauri-apps/cli@2.10.1 signer sign Muninn.app.tar.gz
          test -s Muninn.app.tar.gz.sig
          python3 - "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json" <<'PY'
          import base64, json, sys
          encoded=json.load(open(sys.argv[1]))['plugins']['updater']['pubkey']
          open('updater.pub','wb').write(base64.b64decode(encoded, validate=True))
          sig=base64.b64decode(open('Muninn.app.tar.gz.sig','rb').read(), validate=True)
          open('Muninn.app.tar.gz.sig.minisig','wb').write(sig)
          PY
          minisign -Vm Muninn.app.tar.gz -p updater.pub -x Muninn.app.tar.gz.sig.minisig
          echo "version=$INPUT_VERSION tag=$INPUT_TAG commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > release-review.txt
          shasum -a 256 Muninn.app.tar.gz Muninn.app.tar.gz.sig > SHA256SUMS

      - name: Generate and validate updater manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${INPUT_TAG}/Muninn.app.tar.gz"
          python3 build/updater_release.py generate "$INPUT_VERSION" "$url" "$(cat "$RUNNER_TEMP/muninn/Muninn.app.tar.gz.sig")" "$RUNNER_TEMP/muninn/latest.json"
          python3 build/updater_release.py validate "$RUNNER_TEMP/muninn/latest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-release-review-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/muninn/Muninn.app.tar.gz
            ${{ runner.temp }}/muninn/Muninn.app.tar.gz.sig
            ${{ runner.temp }}/muninn/latest.json
            ${{ runner.temp }}/muninn/SHA256SUMS
            ${{ runner.temp }}/muninn/release-review.txt
            ${{ runner.temp }}/muninn/verify-macos.txt
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: prepare
    environment:
      name: muninn-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: updater-release-review-${{ inputs.tag }}
          path: release-assets
      - name: Upload assets to existing GitHub Release only
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$INPUT_TAG" >/dev/null
          gh release upload "$INPUT_TAG" release-assets/Muninn.app.tar.gz release-assets/Muninn.app.tar.gz.sig release-assets/latest.json release-assets/SHA256SUMS --clobber
