name: Publish CI artifacts to GitHub Packages
on:
  workflow_run:
    workflows: [Checks, Apple Silicon build]
    types: [completed]

# This privileged workflow runs the trusted default-branch script, with no PR
# checkout and no RUN instruction in any OCI Dockerfile. Uploaded snapshots
# are untrusted data. Fork-originated workflow runs are ineligible.
permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == 'iarnvidr/muninn' &&
      (github.event.workflow_run.name == 'Checks' ||
       (github.event.workflow_run.name == 'Apple Silicon build' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      # OCI tags are immutable by policy, but GHCR does not provide a
      # compare-and-swap on the initial push. Serialize independent Linux,
      # macOS and PR producers so two publishers cannot both observe a
      # missing tag and race to overwrite the same crate identity.
      group: ghcr-muninn-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate origin, identity, artifact and immutable tags
        id: package
        run: python3 ci/dagger/check/package_metadata.py "$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
      - name: Download completed workflow's data artifact
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/muninn-package"
          gh run download "$WORKFLOW_RUN_ID" --repo iarnvidr/muninn --name "$ARTIFACT_NAME" --dir "$RUNNER_TEMP/muninn-package"
      - name: Include exact native candidate archive and release receipt
        if: ${{ steps.download.outcome == 'success' && steps.package.outputs.kind == 'macos-candidate-v1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/muninn-package/native-candidate"
          gh run download "$WORKFLOW_RUN_ID" --repo iarnvidr/muninn \
            --name "muninn-native-candidate-${WORKFLOW_RUN_ID}-${WORKFLOW_ATTEMPT}" \
            --dir "$RUNNER_TEMP/muninn-package/native-candidate"
      - name: Include isolated, separately identified PR build in the candidate package
        if: >-
          steps.download.outcome == 'success' &&
          steps.package.outputs.kind == 'macos-candidate-v1' &&
          github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/muninn-package/pr-preview"
          gh run download "$WORKFLOW_RUN_ID" --repo iarnvidr/muninn \
            --name muninn-pr-preview-arm64 \
            --dir "$RUNNER_TEMP/muninn-package/pr-preview"
      - name: Publish raw cache or native test build as an OCI package
        if: steps.download.outcome == 'success'
        env:
          GHCR_PUBLISH_TOKEN: ${{ github.token }}
          PACKAGE_IMAGE: ${{ steps.package.outputs.image }}
          PACKAGE_KIND: ${{ steps.package.outputs.kind }}
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
          PACKAGE_TAGS: ${{ steps.package.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_KIND" == cargo-cache-v1 ]]; then
            dockerfile="ci/dagger/check/Dockerfile.cargo-cache"
            test -f "$RUNNER_TEMP/muninn-package/muninn-linux-cargo-snapshot.tar.zst"
          elif [[ "$PACKAGE_KIND" == macos-candidate-v1 ]]; then
            dockerfile="ci/dagger/check/Dockerfile.macos-candidate"
            # upload-artifact uses RUNNER_TEMP as the least common ancestor
            # because the native package also includes smoke evidence. Bring
            # the candidate archives back to the historical image root.
            if [[ -d "$RUNNER_TEMP/muninn-package/muninn" ]]; then
              find "$RUNNER_TEMP/muninn-package/muninn" -maxdepth 1 -type f -name 'Muninn_*' \
                -exec mv -t "$RUNNER_TEMP/muninn-package" -- {} +
            fi
            compgen -G "$RUNNER_TEMP/muninn-package/Muninn_*.zip" >/dev/null
          else
            echo 'Unsupported package kind' >&2
            exit 1
          fi
          printf '%s' "$GHCR_PUBLISH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          read -r -a tags <<< "$PACKAGE_TAGS"
          reference="$PACKAGE_IMAGE:${tags[0]}"
          docker build --file "$dockerfile" --label "org.opencontainers.image.revision=$PACKAGE_SHA" --tag "$reference" "$RUNNER_TEMP/muninn-package"
          docker push "$reference"
          for tag in "${tags[@]:1}"; do
            docker tag "$reference" "$PACKAGE_IMAGE:$tag"
            docker push "$PACKAGE_IMAGE:$tag"
          done
          echo "Package: $reference" >> "$GITHUB_STEP_SUMMARY"
          echo 'Compiled caches are not check receipts; macOS candidates are not production releases.' >> "$GITHUB_STEP_SUMMARY"
      - name: Download exact passing Dagger check receipt
        id: receipt-download
        if: >-
          github.event.workflow_run.name == 'Checks' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/muninn-check-evidence"
          gh run download "$WORKFLOW_RUN_ID" --repo iarnvidr/muninn \
            --name "muninn-check-candidate-${WORKFLOW_RUN_ID}-${WORKFLOW_ATTEMPT}" \
            --dir "$RUNNER_TEMP/muninn-check-evidence"
      - name: Retain passing Dagger check receipt as a separate GHCR package
        if: steps.receipt-download.outcome == 'success'
        env:
          GHCR_PUBLISH_TOKEN: ${{ github.token }}
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
          PACKAGE_TAGS: ${{ steps.package.outputs.tags }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/muninn-check-evidence/check-candidate.json"
          printf '%s' "$GHCR_PUBLISH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/iarnvidr/muninn-check-evidence
          read -r -a tags <<< "$PACKAGE_TAGS"
          reference="$image:${tags[0]}"
          docker build --file ci/dagger/check/Dockerfile.check-evidence \
            --label "org.opencontainers.image.revision=$PACKAGE_SHA" \
            --tag "$reference" "$RUNNER_TEMP/muninn-check-evidence"
          docker push "$reference"
          for tag in "${tags[@]:1}"; do
            docker tag "$reference" "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Check receipt: $reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Missing compilation snapshot
        if: steps.download.outcome != 'success'
        run: echo 'No compiled-cache/native-build artifact was exported for this run; that OCI package was not published.' >> "$GITHUB_STEP_SUMMARY"

  # Compiled Rust crates are independent OCI products. A failure in the older
  # macOS candidate/raw-cache copier must never block their publication.
  publish-crates:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == 'iarnvidr/muninn' &&
      (github.event.workflow_run.name == 'Checks' ||
       github.event.workflow_run.name == 'Apple Silicon build')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: ghcr-muninn-crate-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source workflow metadata
        run: python3 ci/dagger/check/package_metadata.py "$GITHUB_EVENT_PATH" >/dev/null
      # These are individually addressable compiled workspace crate packages,
      # not the combined target snapshot above. Only *fully successful* source
      # workflows can publish units; this trusted job never runs PR code.
      - name: Download independently compiled crates from successful workflow
        id: crates-download
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_NAME" in
            Checks) platform=linux ;;
            'Apple Silicon build') platform=macos ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/muninn-crate-packages"
          gh run download "$WORKFLOW_RUN_ID" --repo iarnvidr/muninn \
            --name "muninn-crates-${platform}-${WORKFLOW_RUN_ID}-${WORKFLOW_ATTEMPT}" \
            --dir "$RUNNER_TEMP/muninn-crate-packages"
      - name: Identify the exact originating CI source tree
        id: crate-source
        if: steps.crates-download.outcome == 'success'
        run: |
          set -euo pipefail
          source_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/muninn-crate-packages/index.json"))["source_sha"])')"
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Malformed CI source SHA'; exit 1; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Read original test-merge sources as data only
        if: steps.crate-source.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.crate-source.outputs.sha }}
          # Parent verification requires the original PR merge's second
          # parent; shallow checkout hides that ancestry.
          fetch-depth: 0
          path: crate-source
          persist-credentials: false
      - name: Install pinned ORAS artifact client
        if: steps.crate-source.outcome == 'success'
        env:
          GOBIN: ${{ runner.temp }}
        run: GOTOOLCHAIN=auto go install oras.land/oras/cmd/oras@v1.3.0
      - name: Verify sources and publish immutable per-crate OCI packages
        if: steps.crate-source.outcome == 'success'
        env:
          GHCR_PUBLISH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_PUBLISH_TOKEN" | "$RUNNER_TEMP/oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          case "$WORKFLOW_NAME" in
            Checks) platform=linux-amd64 ;;
            'Apple Silicon build') platform=macos-arm64 ;;
            *) exit 1 ;;
          esac
          python3 ci/dagger/check/crate_packages.py publish \
            --root crate-source --input "$RUNNER_TEMP/muninn-crate-packages" \
            --platform "$platform" --run-id "$WORKFLOW_RUN_ID" \
            --head-sha "$WORKFLOW_HEAD_SHA" --event "$WORKFLOW_EVENT" \
            --oras "$RUNNER_TEMP/oras"
