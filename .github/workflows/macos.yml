name: Apple Silicon build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Match release and debug compilation; do not accidentally invalidate one
      # set of artifacts with a different deployment target in the next step.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_INCREMENTAL: '0'
      # Embed the exact checkout and PR head so diagnostics distinguish builds
      # even when the application SemVer is intentionally unchanged.
      MUNINN_BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'pr' || 'ci' }}
      MUNINN_BUILD_SHA: ${{ github.sha }}
      MUNINN_BUILD_PR: ${{ github.event.pull_request.number || '' }}
      MUNINN_BUILD_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
      MUNINN_BUILD_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Restore helper tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/muninn-tools
          key: muninn-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/tools.lock.json', 'build/ffmpeg_lgpl.py') }}
      - name: Install helper build tools
        run: brew install meson ninja pkgconf
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Fingerprint the native compiler and SDK
        id: rust-cache-abi
        run: |
          set -euo pipefail
          fingerprint="$(
            {
              rustc -vV
              cargo -vV
              xcodebuild -version
              xcrun --sdk macosx --show-sdk-version
              printf '%s\n' "$MACOSX_DEPLOYMENT_TARGET" "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}"
            } | shasum -a 256 | cut -d ' ' -f 1
          )"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore native Cargo downloads and compiled artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: muninn-native-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-abi.outputs.fingerprint }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'build/build-native-macos.sh') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'crates/*/Cargo.toml', 'src-tauri/Cargo.toml') }}-${{ hashFiles('core/**', 'crates/**', 'src-tauri/**', 'ui/**') }}
          restore-keys: |
            muninn-native-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-abi.outputs.fingerprint }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'build/build-native-macos.sh') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'crates/*/Cargo.toml', 'src-tauri/Cargo.toml') }}-
            muninn-native-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-abi.outputs.fingerprint }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'build/build-native-macos.sh') }}-
      # This release build/package and its launch-health check intentionally do not
      # run the debug-only e2e harness.
      - name: Build, test and sign release artifact
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/muninn"
      - name: Build and mount-verify the DMG with corresponding sources
        run: |
          set -euo pipefail
          python3 build/release_sources.py prepare "$RUNNER_TEMP/muninn/corresponding-source"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          bash build/package-dmg.sh "$RUNNER_TEMP/muninn/Muninn.app" "$RUNNER_TEMP/muninn/corresponding-source" "$RUNNER_TEMP/muninn/Muninn_${version}_macos-arm64.dmg"
      - name: Release app launch and localhost health smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/muninn-release-evidence
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/muninn/Muninn.app"
      - name: Build debug binary for native UI interactions
        run: cargo build --locked -p muninn --target aarch64-apple-darwin
      - id: prepare-debug-smoke
        name: Prepare isolated debug bundle for native smokes
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/muninn-debug-smoke/Muninn.app"
          mkdir -p "$(dirname "$app")"
          ditto "$RUNNER_TEMP/muninn/Muninn.app" "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          debug_binary="${CARGO_TARGET_DIR:-target}/aarch64-apple-darwin/debug/muninn"
          test -x "$debug_binary"
          cp "$debug_binary" "$app/Contents/MacOS/$exe"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
      - id: updater-smoke
        if: ${{ !cancelled() && steps['prepare-debug-smoke'].outcome == 'success' }}
        name: Native signed updater integration smoke (debug bundle)
        env:
          MUNINN_UPDATER_SMOKE_APP: ${{ runner.temp }}/muninn-debug-smoke/Muninn.app
          MUNINN_UPDATER_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/muninn-updater-evidence
        run: bash build/updater-smoke/run-macos.sh
      - name: Native UI interaction smoke (debug bundle only)
        if: ${{ !cancelled() && steps['prepare-debug-smoke'].outcome == 'success' }}
        env:
          NATIVE_UI_EVIDENCE_DIR: ${{ runner.temp }}/muninn-debug-ui-evidence
        run: bash build/native-ui-smoke.sh "$RUNNER_TEMP/muninn-debug-smoke/Muninn.app" "$RUNNER_TEMP/muninn-debug-ui-evidence"
      - name: Record exact native release candidate
        run: python3 build/release_candidate.py create --root "$RUNNER_TEMP/muninn" --source-root "$GITHUB_WORKSPACE"
      - id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muninn-macos-arm64
          path: |
            ${{ runner.temp }}/muninn/Muninn_*.zip
            ${{ runner.temp }}/muninn/Muninn_*.zip.sha256
            ${{ runner.temp }}/muninn/Muninn_*.dmg
            ${{ runner.temp }}/muninn/verify-macos.txt
            ${{ runner.temp }}/muninn-release-evidence/**
            ${{ runner.temp }}/muninn-debug-ui-evidence/**
            ${{ runner.temp }}/muninn-updater-evidence/**
          if-no-files-found: error
          retention-days: 30
      - name: Show where to download this build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Muninn test build (Apple Silicon)"
            echo
            echo "Download: [muninn-macos-arm64]($ARTIFACT_URL) (sign in to GitHub; includes release archive/checksum and separate debug UI smoke evidence)."
            echo "Not a release: ad-hoc signed and not notarized. See README, Install on the Mac."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $ARTIFACT_URL"
      - name: Retain exact native release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muninn-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/muninn/native-candidate/*
          if-no-files-found: error
          retention-days: 90
      # A separate user-facing PR application; do not change the exact
      # Muninn.app/native receipt used by the trusted release-promotion gate.
      - name: Build separately identified Muninn Preview app
        if: github.event_name == 'pull_request'
        run: bash build/build-preview-macos.sh "$RUNNER_TEMP/muninn" "$RUNNER_TEMP/muninn-preview" "$RUNNER_TEMP/muninn/corresponding-source"
      - name: Smoke isolated PR Preview launch
        if: github.event_name == 'pull_request'
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/muninn-preview-evidence
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/muninn-preview/Muninn Preview.app"
      - name: Retain independently installable PR Preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muninn-pr-preview-arm64
          path: |
            ${{ runner.temp }}/muninn-preview/Muninn_PR*_macos-arm64.dmg
            ${{ runner.temp }}/muninn-preview/Muninn_PR*_macos-arm64.zip
            ${{ runner.temp }}/muninn-preview/Muninn_PR*_macos-arm64.zip.sha256
            ${{ runner.temp }}/muninn-preview-evidence/**
          if-no-files-found: error
          retention-days: 90
# PR builds are never releases. Only the later successful accepted-main mapping
# can trigger trusted automatic preview publication; stable release stays protected.
