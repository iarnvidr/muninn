name: Apple Silicon build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Restore helper tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/muninn-tools
          key: muninn-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/tools.lock.json', 'build/ffmpeg_lgpl.py') }}
      - name: Install helper build tools
        run: brew install meson ninja pkgconf
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      # This release build/package and its launch-health check intentionally do not
      # run the debug-only e2e harness.
      - name: Build, test and sign release artifact
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/muninn"
      - name: Release app launch and localhost health smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/muninn-release-evidence
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/muninn/Muninn.app"
      - name: Build debug binary for native UI interactions
        run: cargo build --locked -p muninn --target aarch64-apple-darwin
      - name: Native UI interaction smoke (debug bundle only)
        env:
          NATIVE_UI_EVIDENCE_DIR: ${{ runner.temp }}/muninn-debug-ui-evidence
        run: bash build/native-ui-smoke.sh "$RUNNER_TEMP/muninn/Muninn.app" "$RUNNER_TEMP/muninn-debug-ui-evidence"
      - id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muninn-macos-arm64
          path: |
            ${{ runner.temp }}/muninn/Muninn_*.zip
            ${{ runner.temp }}/muninn/Muninn_*.zip.sha256
            ${{ runner.temp }}/muninn/verify-macos.txt
            ${{ runner.temp }}/muninn-release-evidence/**
            ${{ runner.temp }}/muninn-debug-ui-evidence/**
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Show where to download this build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Muninn test build (Apple Silicon)"
            echo
            echo "Download: [muninn-macos-arm64]($ARTIFACT_URL) (sign in to GitHub; includes release archive/checksum and separate debug UI smoke evidence)."
            echo "Not a release: ad-hoc signed and not notarized. See README, Install on the Mac."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $ARTIFACT_URL"
# Deliberately no automatic GitHub release. See docs/PUBLICATION.md before releasing.
