name: Apple Silicon build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Restore helper tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/muninn-tools
          key: muninn-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/tools.lock.json', 'build/ffmpeg_lgpl.py') }}
      - name: Install helper build tools
        run: brew install meson ninja pkgconf
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build, test and sign locally
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/muninn"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muninn-macos-arm64
          path: ${{ runner.temp }}/muninn/*
          if-no-files-found: error
          # Builds of main stay downloadable for a month; PR builds for a week.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Show where to download this build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Muninn test build (Apple Silicon)"
            echo
            echo "Download: [muninn-macos-arm64]($ARTIFACT_URL) (sign in to GitHub; zip with Muninn.app and its .sha256)."
            echo "Not a release: ad-hoc signed and not notarized. See README, Install on the Mac."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $ARTIFACT_URL"
# Deliberately no automatic GitHub release. See docs/PUBLICATION.md before releasing.
