name: Apple Silicon build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Restore helper tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/muninn-tools
          key: muninn-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/tools.lock.json', 'build/ffmpeg_lgpl.py') }}
      - name: Install helper build tools
        run: brew install meson ninja pkgconf
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build, test and sign locally
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/muninn"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muninn-macos-arm64
          path: ${{ runner.temp }}/muninn/*
          if-no-files-found: error
          retention-days: 7
# Deliberately no automatic GitHub release. See docs/PUBLICATION.md before releasing.
