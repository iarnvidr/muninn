name: Map accepted Muninn native artifact
on:
  push:
    branches: [main]
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
concurrency:
  group: muninn-native-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Map the exact accepted merge to its native PR artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/release_candidate.py promote --root "$GITHUB_WORKSPACE" --merge-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muninn-accepted-native-${{ github.sha }}
          path: accepted-native.json
          if-no-files-found: error
          retention-days: 90
