name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan source history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
      - name: Rust, JavaScript, packaging, and publication checks
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 0.21.11
          verb: call
          module: ./ci/dagger/check
          args: checks --source .
      - name: Record Dagger check receipt
        if: github.event_name == 'pull_request'
        run: python3 build/release_candidate.py create-check --root "$GITHUB_WORKSPACE"
      - name: Upload Dagger check receipt
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muninn-check-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: check-candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Publication boundary checks (Git metadata required)
        run: python3 build/check_publication.py
