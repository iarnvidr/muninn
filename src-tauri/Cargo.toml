[package]
name = "muninn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Disk-backed local-first YouTube browser for macOS"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Release builds (what the CLI would pass): serve the embedded assets, not a dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.12", features = ["unstable", "macos-proxy"] }
url = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
muninn-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = "3"
tokio = { version = "1", features = ["macros", "time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
core-foundation = "0.10"
security-framework = "3"
