<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self' ipc: http://ipc.localhost; object-src 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Muninn</title>
<link rel="icon" href="/ui/raven.png">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>

<div id="app" class="app" data-sidebar="expanded">

  <header id="topbar" class="topbar">
    <div class="tabrow">
      <div id="tabstrip" class="tabstrip" role="tablist" aria-label="Tabs"></div>
      <button type="button" id="tab-new" class="icon-btn" data-icon="plus" title="New tab (Cmd/Ctrl+T)" aria-label="New tab"></button>
      <button type="button" id="tab-ungroup" class="tab-ungroup">Drop to ungroup</button>
    </div>
    <div class="toolbar" role="toolbar" aria-label="Navigation">
      <button type="button" id="nav-back" class="icon-btn" data-icon="back" title="Back (Cmd+[)" aria-label="Back" disabled></button>
      <button type="button" id="nav-forward" class="icon-btn" data-icon="forward" title="Forward (Cmd+])" aria-label="Forward" disabled></button>
      <button type="button" id="nav-reload" class="icon-btn" data-icon="reload" title="Reload (Cmd/Ctrl+R)" aria-label="Reload" disabled></button>
      <form id="address-form" class="address-form" autocomplete="off">
        <input type="text" id="address" class="address" placeholder="Search YouTube or enter an address" aria-label="Address or search" spellcheck="false" autocapitalize="off" autocorrect="off">
      </form>
      <span id="view-context" class="view-context" hidden></span>
      <div id="status" class="status" data-kind="none" role="status" aria-live="polite">
        <span id="status-text" class="status-text"></span>
        <button type="button" id="status-action" class="small" hidden></button>
        <span class="status-bar" aria-hidden="true"><span id="status-fill" class="status-fill"></span></span>
      </div>
    </div>
  </header>

  <nav id="sidebar" class="sidebar" aria-label="Sections">
    <div class="muninn-brand" aria-label="Muninn · local video library">
      <img class="brand-raven" src="/ui/raven.png" alt="">
      <div><strong>Muninn</strong><span>Video archive</span></div>
    </div>
    <span class="nav-caption">Workspace</span>
    <button type="button" class="side-item" data-page="browse" title="Browse"><span class="side-icon" data-icon="browse"></span><span class="side-label">Browse</span></button>
    <button type="button" class="side-item" data-page="player" title="Player"><span class="side-icon" data-icon="play"></span><span class="side-label">Player</span></button>
    <button type="button" class="side-item" data-page="library" title="Library"><span class="side-icon" data-icon="library"></span><span class="side-label">Library</span></button>
    <button type="button" class="side-item" data-page="feeds" title="Feeds"><span class="side-icon" data-icon="feeds"></span><span class="side-label">Feeds</span></button>
    <button type="button" class="side-item" data-page="rules" title="Rules"><span class="side-icon" data-icon="rules"></span><span class="side-label">Rules</span></button>
    <button type="button" class="side-item" data-page="settings" title="Settings"><span class="side-icon" data-icon="settings"></span><span class="side-label">Settings</span></button>
    <span class="side-spacer"></span>
    <div class="sidebar-note"><span class="local-dot"></span> Stored on this device</div>
    <button type="button" id="side-toggle" class="side-item" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true"><span class="side-icon" data-icon="collapse"></span><span class="side-label">Collapse</span></button>
  </nav>

  <!-- The native YouTube web view is overlaid on exactly this rectangle by the shell. -->
  <main id="content" class="content" tabindex="-1">
    <section id="view-empty" class="view view-empty" hidden>
      <div class="empty-box">
        <h1 class="h1">No tabs open</h1>
        <p class="muted">Open a tab to browse YouTube. Videos you open play here, in Muninn's own player.</p>
        <button type="button" id="empty-new" class="primary">New tab</button>
      </div>
    </section>
    <section id="view-restore" class="view view-restore" hidden></section>
    <section id="view-watch" class="view view-watch" hidden></section>
    <section id="view-internal" class="view view-internal" hidden></section>
  </main>

</div>

<dialog id="confirm" class="modal" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title" class="h3">Confirm</h2>
    <p id="confirm-msg"></p>
    <div class="actions end">
      <button type="submit" value="cancel" id="confirm-cancel">Cancel</button>
      <button type="submit" value="ok" id="confirm-ok" class="danger">OK</button>
    </div>
  </form>
</dialog>

<script src="/ui/lib.js"></script>
<script src="/ui/app.js"></script>
<script src="/ui/watch.js"></script>
<script src="/ui/pages.js"></script>
<script src="/ui/organize.js"></script>
<script src="/ui/channels.js"></script>
<script src="/ui/boot.js"></script>
</body>
</html>
